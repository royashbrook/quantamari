name: verify + deploy royashbrook.com

on:
  push:
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quarkatamari-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:all

  deploy-site:
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: build + deploy royashbrook.com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          QUARKATAMARI_REF: ${{ github.sha }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          git clone --depth 1 https://github.com/royashbrook/royashbrook.com site
          cd site
          npm ci
          npm run build
          test -f dist/quarkatamari/index.html
          grep -q 'data-release="v2-sveltekit"' dist/quarkatamari/index.html
          grep -q "name=\"app-commit\" content=\"$QUARKATAMARI_REF\"" dist/quarkatamari/index.html
          npx wrangler deploy
