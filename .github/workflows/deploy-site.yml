name: verify + deploy quantamari.royashbrook.com

# The game deploys itself. Its former shared-site subpath made two unrelated projects
# share a release: the content site had to redeploy for a game change, and a game that
# failed to build could hold up the site. Its own origin ends both.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quantamari-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      QUANTAMARI_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:all
      - name: verify release provenance
        run: |
          grep -Fq "$GITHUB_SHA" dist/client/_app/version.json
      - name: upload verified deploy artifact
        uses: actions/upload-artifact@v7
        with:
          name: quantamari-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/client
          if-no-files-found: error
          retention-days: 1
      - name: upload performance + e2e results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quantamari-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/results/e2e/**/performance-baseline.json
          if-no-files-found: warn
          retention-days: 30

  deploy:
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: download verified deploy artifact
        uses: actions/download-artifact@v8
        with:
          name: quantamari-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/client
      # serve-at-root means these live at the top of the output now, not under a
      # subpath. checking them here keeps a silent structural change from shipping.
      - name: sanity-check the built output
        run: |
          test -f dist/client/index.html
          test -f dist/client/_headers
          test -f dist/client/manifest.webmanifest
          grep -Fq "$GITHUB_SHA" dist/client/_app/version.json
          find dist/client/_app -name '*.map' -print -quit | grep -q .
          npm run test:artifact
      - name: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set. add the repo secret to enable deploys."
            exit 1
          fi
          npx --no-install wrangler deploy
      - name: verify the deployed commit
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS https://quantamari.royashbrook.com/_app/version.json |
              grep -Fq "$GITHUB_SHA"; then
              exit 0
            fi
            sleep 2
          done
          echo "quantamari.royashbrook.com did not publish $GITHUB_SHA"
          exit 1
      - name: install production smoke browser
        run: npx playwright install --with-deps chromium
      - name: prove the deployed PWA installs and works offline
        run: node scripts/smoke-live-pwa.mjs "$GITHUB_SHA"
