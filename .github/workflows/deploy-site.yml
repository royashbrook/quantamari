name: deploy royashbrook.com

# royashbrook.com owns /quarkatamari and pulls this repository during its build. Rebuild the site on
# every push to main so game updates appear immediately instead of waiting for the site's daily run.
# This uses the same fleet Cloudflare token as the site and skips safely until that repository secret
# is configured.
on:
  push:
    branches: [main]

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: build + deploy royashbrook.com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set, skipping the site redeploy (add the secret to enable)."
            exit 0
          fi
          git clone --depth 1 https://github.com/royashbrook/royashbrook.com site
          cd site
          npm ci
          npm run build
          npx wrangler deploy
